<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1022">
  <title>Contact · Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem 1rem; color: #f7f8ff; background: #0b1022; }
    .glow { position: fixed; width: 34rem; height: 34rem; border-radius: 50%; filter: blur(100px); opacity: .28; pointer-events: none; }
    .glow.one { background: #7858ff; top: -17rem; left: -9rem; }
    .glow.two { background: #14c8c8; bottom: -20rem; right: -8rem; }
    .card { position: relative; width: min(92vw, 740px); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid rgba(255,255,255,.13); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025)); box-shadow: 0 28px 100px rgba(0,0,0,.38); backdrop-filter: blur(18px); }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: .6rem; margin-bottom: 2.7rem; }
    nav a { padding: .6rem 1rem; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; color: #c6c9dc; text-decoration: none; font-size: .9rem; transition: background .2s, color .2s, border-color .2s; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; border-color: rgba(184,168,255,.45); background: rgba(165,139,255,.14); }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; padding: .48rem .85rem; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; color: #c6c9dc; font-size: .78rem; letter-spacing: .13em; text-transform: uppercase; }
    .spark { color: #9f8aff; font-size: 1rem; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(2.8rem, 9vw, 5.3rem); line-height: 1; letter-spacing: -.065em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #b8a8ff 8%, #78e4e0 92%); background-clip: text; -webkit-background-clip: text; }
    p { margin: 0 0 1rem; color: #b7bdd2; font-size: 1.05rem; line-height: 1.85; }
    .lead { font-size: clamp(1.1rem, 3vw, 1.25rem); }
    .rule { width: 3.5rem; height: 3px; margin: 2rem 0 0; border-radius: 3px; background: linear-gradient(90deg, #a58bff, #66ded5); }
    @media (prefers-reduced-motion: no-preference) { .card { animation: arrive .7s cubic-bezier(.2,.8,.2,1) both; } @keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div>
  <main class="card">
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> Let’s connect</div>
    <h1><span>Contact</span></h1>
    <p class="lead">Have a question, an idea, or just want to say hello?</p>
    <p>This page is ready for your preferred contact details. Add an email address or social link here so visitors know where to reach you.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
