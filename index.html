<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1022">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #f7f8ff; background: #0b1022; }
    .glow { position: fixed; width: 34rem; height: 34rem; border-radius: 50%; filter: blur(100px); opacity: .28; pointer-events: none; }
    .glow.one { background: #7858ff; top: -17rem; left: -9rem; }
    .glow.two { background: #14c8c8; bottom: -20rem; right: -8rem; }
    main { position: relative; width: min(90vw, 700px); padding: clamp(2.5rem, 8vw, 5.5rem) 2rem; text-align: center; border: 1px solid rgba(255,255,255,.13); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025)); box-shadow: 0 28px 100px rgba(0,0,0,.38); backdrop-filter: blur(18px); }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; padding: .48rem .85rem; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; color: #c6c9dc; font-size: .78rem; letter-spacing: .13em; text-transform: uppercase; }
    .spark { color: #9f8aff; font-size: 1rem; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(3rem, 10vw, 6rem); line-height: .98; letter-spacing: -.065em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #b8a8ff 8%, #78e4e0 92%); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 34rem; margin: 0 auto; color: #b7bdd2; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.8; }
    .rule { width: 3.5rem; height: 3px; margin: 2rem auto 0; border-radius: 3px; background: linear-gradient(90deg, #a58bff, #66ded5); }
    @media (prefers-reduced-motion: no-preference) { main { animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; } @keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A little beginning</div>
    <h1><span>Hello, world!</span></h1>
    <p>A tiny page with a big first step. Here’s to all the lovely things you’ll make from here.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
